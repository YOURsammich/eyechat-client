<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cope.chat - Games</title>
  <meta name="description" content="Play Cope.chat's games — UNO, shared minesweeper, the whiteboard — without being in the chat." />
  <link rel="icon" type="image/x-icon" href="/images/emojis/copium.png" />
  <!-- The panels' icons (the launcher rows, the whiteboard's toolbar). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- Shared side-page chrome (body palette, .wrap, .card, .btn), same as the
       search and features pages. No theme.css: its #root/body rules are the
       chat shell's, and the handful of chat classes the game panels use are
       carried in games.css instead. -->
  <link href="/search.css" rel="stylesheet" />
  <!-- Hub additions (lobby grid, toasts, the panels' chat classes). External
       for the same reason search.css is: an inline <style> makes the
       multi-entry Vite build go through the html-inline-proxy plugin, which
       has failed intermittently on this build. -->
  <link href="/games.css" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/games.jsx"></script>
</body>
</html>
