<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cope.chat</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link href="/theme.css" rel="stylesheet">
  <link href="/chat-messages.css" rel="stylesheet">
  <link href="/cosmetics.css" rel="stylesheet">
  <link href="/gamecards.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/images/emojis/copium.png">
  <script>
    // Start the session handshake immediately, before the app bundle downloads
    // and parses, so this round-trip overlaps bundle load instead of stacking
    // after it. socket.init() reuses this in-flight promise.
    // The room comes from the URL (cope.chat/ is main, cope.chat/<room> is that
    // room); src/utils/room.js reads it the same way.
    window.__preconnect = fetch('/preconnect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || 'main' })
    })
      .then(res => res.json())
      .catch(err => ({ success: false, error: err }));
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/App.jsx"></script>
</body>
</html>
